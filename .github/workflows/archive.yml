
name: YouTube Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# Evita ejecuciones simultáneas y conserva una cola de hasta 100 pendientes.
concurrency:
  group: youtube-archive
  queue: max

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      # ========================
      # REPOSITORIO
      # ========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================
      # NODE.JS
      # ========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ========================
      # PYTHON
      # ========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ========================
      # DEPENDENCIAS
      # ========================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade "yt-dlp[default]"

          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

          echo "===== VERSIONES INSTALADAS ====="
          yt-dlp --version
          rclone version
          ffmpeg -version | head -n 1
          node --version

      # ========================
      # CONFIGURACION RCLONE
      # ========================
      - name: Setup rclone
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail

          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"

          if [[ -z "${RCLONE_CONFIG_B64:-}" ]]; then
            echo "::error::Falta configurar el secreto RCLONE_CONFIG."
            exit 1
          fi

          if ! printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"; then
            echo "::error::No se pudo decodificar RCLONE_CONFIG."
            rm -f "$CONFIG_FILE"
            exit 1
          fi

          if [[ ! -s "$CONFIG_FILE" ]]; then
            echo "::error::La configuración de rclone está vacía."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          install -m 600 "$CONFIG_FILE" "$HOME/.config/rclone/rclone.conf"
          rm -f "$CONFIG_FILE"

          if ! rclone listremotes | grep -Fxq "gdrive:"; then
            echo "::error::No se encontró el remoto gdrive en la configuración de rclone."
            exit 1
          fi

          echo "Configuración de rclone cargada correctamente."

      # ========================
      # COOKIES OBLIGATORIAS
      # ========================
      - name: Setup YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail

          COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"

          if [[ -z "${YOUTUBE_COOKIES_B64:-}" ]]; then
            echo "::error::Falta configurar el secreto obligatorio YOUTUBE_COOKIES."
            exit 1
          fi

          if ! printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$COOKIE_FILE"; then
            echo "::error::No se pudo decodificar YOUTUBE_COOKIES en Base64."
            rm -f "$COOKIE_FILE"
            exit 1
          fi

          chmod 600 "$COOKIE_FILE"

          if [[ ! -s "$COOKIE_FILE" ]]; then
            echo "::error::El archivo de cookies está vacío."
            exit 1
          fi

          if ! head -n 1 "$COOKIE_FILE" | grep -Eq '^# (HTTP Cookie File|Netscape HTTP Cookie File)$'; then
            echo "::error::Las cookies no tienen un encabezado Netscape válido."
            exit 1
          fi

          COOKIE_COUNT=$(awk -F '\t' '
            !/^#/ && NF == 7 && ($1 ~ /(^|\.)youtube\.com$/ || $1 ~ /(^|\.)google\.com$/ || $1 ~ /(^|\.)googlevideo\.com$/) { count++ }
            END { print count+0 }
          ' "$COOKIE_FILE")

          if [[ "$COOKIE_COUNT" -eq 0 ]]; then
            echo "::error::No se encontraron cookies de dominios de YouTube/Google en formato Netscape."
            exit 1
          fi

          echo "YOUTUBE_COOKIES_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"

          echo "Cookies Netscape cargadas. Registros relevantes: $COOKIE_COUNT"

      # ========================
      # PREPARAR HISTORIAL
      # ========================
      - name: Restore and validate archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"
          BACKUPS="$REMOTE/archive-backups"

          rclone mkdir "$REMOTE"
          rclone mkdir "$BACKUPS"

          REMOTE_FILES="$(rclone lsf "$REMOTE" --files-only)"

          if printf '%s\n' "$REMOTE_FILES" | grep -Fxq "archive.txt"; then
            echo "Restaurando historial remoto..."

            rclone copyto "$REMOTE/archive.txt" archive.txt

            if [[ ! -s archive.txt ]]; then
              echo "::error::El historial remoto está vacío. Se detiene para protegerlo."
              exit 1
            fi

            echo "archive_existed=true" >> "$GITHUB_OUTPUT"
          else
            BACKUP_FILES="$(rclone lsf "$BACKUPS" --files-only)"

            if [[ -n "$BACKUP_FILES" ]]; then
              echo "::error::No existe archive.txt, pero hay copias de seguridad."
              echo "::error::Recupera una copia antes de continuar."
              exit 1
            fi

            echo "::warning::No existe historial ni respaldo previo; se inicializa por primera vez."

            : > archive.txt

            echo "archive_existed=false" >> "$GITHUB_OUTPUT"
          fi

          # Formato esperado: extractor e ID.
          if [[ -s archive.txt ]]; then
            awk '
              NF != 2 {
                printf "Registro malformado en línea %d.\n", NR > "/dev/stderr"
                bad=1
                next
              }

              $1 !~ /^[[:alnum:]_-]+$/ || $2 !~ /^[[:alnum:]_-]+$/ {
                printf "Registro inválido en línea %d.\n", NR > "/dev/stderr"
                bad=1
                next
              }

              seen[$1 FS $2]++ {
                printf "Registro duplicado en línea %d.\n", NR > "/dev/stderr"
                bad=1
              }

              END { exit bad }
            ' archive.txt || {
              echo "::error::archive.txt no supera la validación estructural."
              exit 1
            }
          fi

          cp archive.txt archive.before.txt

          mkdir -p downloads

          echo "Historial restaurado y validado."

      # ========================
      # DESCARGAS AUTENTICADAS
      # ========================
      - name: Download new videos with cookies
        id: download
        shell: bash
        run: |
          set -uo pipefail

          DOWNLOAD_TECHNICAL_ERRORS=0
          MEMBERSHIP_RESTRICTIONS=0

          # Comprobación defensiva de las cookies.
          if [[ -z "${YOUTUBE_COOKIES_FILE:-}" || ! -s "$YOUTUBE_COOKIES_FILE" ]]; then
            echo "::error::Las cookies obligatorias no están disponibles."
            exit 1
          fi

          # Preferencia: MP4 AVC1 + M4A MP4A, máximo 1080p.
          FORMAT='bestvideo[ext=mp4][vcodec^=avc1][height<=1080]+bestaudio[ext=m4a][acodec^=mp4a]/best[ext=mp4][height<=1080]'

          # Canal/año/mes/día/fecha - título [ID].ext.
          OUTPUT='downloads/%(uploader)s/%(upload_date>%Y/%m/%d)s/%(upload_date)s - %(title).180s [%(id)s].%(ext)s'

          # Argumentos comunes de yt-dlp.
          COMMON_ARGS=(
            --cookies "$YOUTUBE_COOKIES_FILE"
            --js-runtimes node

            --retries 10
            --fragment-retries 10
            --extractor-retries 5

            --retry-sleep 'http:exp=1:20'
            --retry-sleep 'fragment:exp=1:20'
            --retry-sleep 'extractor:exp=1:20'

            # Continúa con los siguientes vídeos ante errores de descarga.
            # No se utiliza --ignore-errors.
            --no-abort-on-error

            # Solo registra vídeos descargados correctamente.
            --download-archive archive.txt

            --no-overwrites
            --continue

            --merge-output-format mp4
            --embed-thumbnail
            --add-metadata

            --concurrent-fragments 2
            --force-ipv4
            --http-chunk-size 10M

            -f "$FORMAT"
            -o "$OUTPUT"
          )

          if [[ -s canales.txt ]]; then

            # Elimina URLs duplicadas conservando el orden original.
            awk '
              /^[[:space:]]*#/ || /^[[:space:]]*$/ {
                print
                next
              }

              !seen[$0]++ {
                print
              }
            ' canales.txt > canales.unicos.txt

            if [[ ! -s canales.unicos.txt ]]; then
              echo "::warning::No hay URLs válidas en canales.txt."
            else

              echo "::group::Descarga autenticada de canales"

              LOG_FILE="$RUNNER_TEMP/yt-dlp.log"

              # Captura la salida completa sin perder el código de salida
              # del proceso yt-dlp.
              yt-dlp "${COMMON_ARGS[@]}" \
                --sleep-requests 1 \
                --sleep-interval 5 \
                --max-sleep-interval 10 \
                -a canales.unicos.txt \
                2>&1 | tee "$LOG_FILE"

              YT_DLP_STATUS=${PIPESTATUS[0]}

              echo "::endgroup::"

              echo "Código de salida de yt-dlp: $YT_DLP_STATUS"

              # ==========================================
              # CLASIFICACION DE ERRORES
              # ==========================================
              #
              # Solo se consideran restricciones esperadas
              # los mensajes específicos de acceso a vídeos
              # exclusivos para miembros.
              #
              # Cualquier otro ERROR se considera técnico.
              # Si yt-dlp falla sin producir un ERROR reconocible,
              # también se considera un fallo técnico.
              #
              CLASSIFICATION=$(
                python - "$LOG_FILE" "$YT_DLP_STATUS" <<'PY'
          import re
          import sys
          from pathlib import Path

          log_path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])

          try:
              lines = log_path.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines()
          except OSError:
              print("technical_errors=1")
              print("membership_restrictions=0")
              sys.exit(0)

          # Mensajes específicos conocidos de YouTube para contenido
          # exclusivo para miembros del canal.
          membership_markers = (
              "join this channel to get access to members-only content",
              "this video is available to this channel's members",
          )

          error_lines = [
              line for line in lines
              if re.search(r"\bERROR:", line, re.IGNORECASE)
          ]

          membership_errors = [
              line for line in error_lines
              if any(marker in line.lower() for marker in membership_markers)
          ]

          technical_error_lines = [
              line for line in error_lines
              if not any(marker in line.lower() for marker in membership_markers)
          ]

          membership_count = len(membership_errors)

          # Un error no identificado nunca se clasifica como una
          # restricción de membresía.
          technical_error = bool(technical_error_lines)

          # Si yt-dlp devuelve un código distinto de cero sin mensajes
          # ERROR reconocibles, se considera fallo técnico.
          if exit_code != 0 and not error_lines:
              technical_error = True

          # También se considera técnico un código de error acompañado
          # de mensajes que no corresponden a membresías.
          if exit_code != 0 and technical_error_lines:
              technical_error = True

          print(f"technical_errors={int(technical_error)}")
          print(f"membership_restrictions={membership_count}")
          PY
              ) || {
                echo "::error::No se pudo clasificar la salida de yt-dlp."
                exit 1
              }

              while IFS='=' read -r KEY VALUE; do
                case "$KEY" in
                  technical_errors)
                    DOWNLOAD_TECHNICAL_ERRORS="$VALUE"
                    ;;
                  membership_restrictions)
                    MEMBERSHIP_RESTRICTIONS="$VALUE"
                    ;;
                esac
              done <<< "$CLASSIFICATION"

              if [[ "$MEMBERSHIP_RESTRICTIONS" -gt 0 ]]; then
                echo "::warning::Se detectaron $MEMBERSHIP_RESTRICTIONS restricciones de membresía."
                echo "Los vídeos restringidos no se consideran descargados."
                echo "Se volverán a comprobar en futuras ejecuciones."
              fi

              if [[ "$DOWNLOAD_TECHNICAL_ERRORS" -eq 1 ]]; then
                echo "::warning::Se detectaron errores técnicos durante la descarga."
                echo "Se intentará conservar y subir todo lo que se haya completado correctamente."
              fi

            fi
          else
            echo "::warning::canales.txt no existe o está vacío; no hay canales para procesar."
          fi

          # ==========================================
          # VALIDAR HISTORIAL MODIFICADO
          # ==========================================

          if [[ -s archive.txt ]]; then
            awk '
              NF != 2 {
                printf "Registro malformado en línea %d.\n", NR > "/dev/stderr"
                bad=1
                next
              }

              $1 !~ /^[[:alnum:]_-]+$/ || $2 !~ /^[[:alnum:]_-]+$/ {
                printf "Registro inválido en línea %d.\n", NR > "/dev/stderr"
                bad=1
                next
              }

              seen[$1 FS $2]++ {
                printf "Registro duplicado en línea %d.\n", NR > "/dev/stderr"
                bad=1
              }

              END { exit bad }
            ' archive.txt || {
              echo "::error::El historial local quedó malformado después de yt-dlp."
              exit 1
            }
          fi

          # Publica los resultados para el informe final.
          echo "download_technical_errors=$DOWNLOAD_TECHNICAL_ERRORS" >> "$GITHUB_OUTPUT"
          echo "membership_restrictions=$MEMBERSHIP_RESTRICTIONS" >> "$GITHUB_OUTPUT"

          echo "=================================="
          echo "RESUMEN DE DESCARGAS"
          echo "Restricciones de membresía: $MEMBERSHIP_RESTRICTIONS"
          echo "Errores técnicos: $DOWNLOAD_TECHNICAL_ERRORS"
          echo "=================================="

      # ========================
      # SUBIR VIDEOS
      # ========================
      - name: Upload videos to Google Drive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"

          if find downloads -type f -print -quit | grep -q .; then
            echo "Subiendo vídeos a Google Drive..."

            rclone copy downloads/ "$REMOTE/" \
              --transfers 3 \
              --checkers 6 \
              --tpslimit 4 \
              --drive-chunk-size 64M \
              --checksum \
              --retries 5 \
              --retries-sleep 10s \
              --log-level INFO

            echo "Transferencia completada."
          else
            echo "No hay vídeos nuevos para subir."
          fi

      # ========================
      # ACTUALIZAR HISTORIAL
      # ========================
      - name: Backup and upload archive
        shell: bash
        env:
          ARCHIVE_EXISTED: ${{ steps.archive.outputs.archive_existed }}
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"

          # No modifica el historial si no hubo nuevas descargas.
          if cmp -s archive.before.txt archive.txt; then
            echo "No hay cambios en archive.txt."
            exit 0
          fi

          # Respalda el historial anterior antes de sustituirlo.
          if [[ "$ARCHIVE_EXISTED" == "true" ]]; then

            BACKUP_NAME="archive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            BACKUP_PATH="$REMOTE/archive-backups/$BACKUP_NAME"

            rclone copyto archive.before.txt "$BACKUP_PATH"

            # Verifica byte a byte el respaldo.
            rclone cat "$BACKUP_PATH" | cmp - archive.before.txt

            echo "Copia de seguridad creada y verificada: $BACKUP_NAME"
          fi

          # Este paso solo se alcanza si la subida de vídeos terminó correctamente.
          rclone copyto archive.txt "$REMOTE/archive.txt"

          # Verificación byte a byte del historial publicado.
          rclone cat "$REMOTE/archive.txt" | cmp - archive.txt

          echo "Historial actualizado y verificado."

      # ========================
      # INFORME FINAL
      # ========================
      - name: Report download status
        if: always()
        shell: bash
        env:
          DOWNLOAD_TECHNICAL_ERRORS: ${{ steps.download.outputs.download_technical_errors }}
          MEMBERSHIP_RESTRICTIONS: ${{ steps.download.outputs.membership_restrictions }}
        run: |
          set -euo pipefail

          echo "=================================="
          echo "YouTube Archive"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "=================================="

          TECHNICAL="${DOWNLOAD_TECHNICAL_ERRORS:-0}"
          MEMBERSHIP="${MEMBERSHIP_RESTRICTIONS:-0}"

          echo "Restricciones de membresía: $MEMBERSHIP"
          echo "Errores técnicos: $TECHNICAL"

          if [[ "$MEMBERSHIP" -gt 0 ]]; then
            echo "::warning::$MEMBERSHIP vídeos no pudieron descargarse por restricciones de membresía."
            echo "Permanecen pendientes para futuras ejecuciones."
          fi

          if [[ "$TECHNICAL" -eq 1 ]]; then
            echo "::error::Se produjeron errores técnicos durante la descarga."
            echo "Revisa el registro de yt-dlp para identificar su causa."
            exit 1
          fi

          echo "No se detectaron errores técnicos de descarga."
          echo "Ejecución completada con las advertencias indicadas."

      # ========================
      # LIMPIEZA DE CREDENCIALES
      # ========================
      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/youtube-cookies.txt"
          rm -f "$RUNNER_TEMP/rclone.conf"
          rm -f "$RUNNER_TEMP/yt-dlp.log"

          rm -f "$HOME/.config/rclone/rclone.conf"

          rm -f cookies.txt
          rm -f canales.unicos.txt

          echo "Archivos temporales de credenciales eliminados."
