
name: YouTube Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: youtube-archive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES }}

    steps:
      # ========================
      # REPOSITORIO
      # ========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================
      # NODE.JS
      # ========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ========================
      # PYTHON
      # ========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ========================
      # DEPENDENCIAS
      # ========================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade "yt-dlp[default]"

          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

          echo "===== VERSIONES INSTALADAS ====="
          yt-dlp --version
          rclone version
          ffmpeg -version | head -n 1
          node --version

      # ========================
      # CONFIGURACION RCLONE
      # ========================
      - name: Setup rclone
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RCLONE_CONFIG_B64:-}" ]]; then
            echo "::error::Falta configurar el secreto RCLONE_CONFIG."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if ! rclone listremotes | grep -Fxq "gdrive:"; then
            echo "::error::No se encontró el remoto gdrive en la configuración de rclone."
            exit 1
          fi

          echo "Configuración de rclone cargada."

      # ========================
      # COOKIES OBLIGATORIAS
      # ========================
      - name: Setup YouTube cookies
        shell: bash
        run: |
          set -euo pipefail

          COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"

          # Validar que el secreto exista.
          if [[ -z "${YOUTUBE_COOKIES_B64:-}" ]]; then
            echo "::error::Falta configurar el secreto obligatorio YOUTUBE_COOKIES."
            exit 1
          fi

          # Decodificar Base64.
          if ! printf '%s' "$YOUTUBE_COOKIES_B64" \
            | base64 --decode > "$COOKIE_FILE"; then
            echo "::error::No se pudo decodificar YOUTUBE_COOKIES."
            rm -f "$COOKIE_FILE"
            exit 1
          fi

          chmod 600 "$COOKIE_FILE"

          # Validar que el archivo no esté vacío.
          if [[ ! -s "$COOKIE_FILE" ]]; then
            echo "::error::El archivo de cookies está vacío."
            exit 1
          fi

          # Validar encabezado Netscape.
          if ! head -n 1 "$COOKIE_FILE" \
            | grep -Eq '^# (HTTP Cookie File|Netscape HTTP Cookie File)$'; then
            echo "::error::Las cookies no tienen un encabezado Netscape válido."
            exit 1
          fi

          # Validar que existan registros de cookies.
          COOKIE_COUNT=$(awk -F '\t' '
            !/^#/ && NF == 7 { count++ }
            END { print count+0 }
          ' "$COOKIE_FILE")

          if [[ "$COOKIE_COUNT" -eq 0 ]]; then
            echo "::error::El archivo Netscape no contiene registros de cookies válidos."
            exit 1
          fi

          echo "YOUTUBE_COOKIES_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"

          echo "Cookies de YouTube cargadas correctamente."
          echo "Registros encontrados: $COOKIE_COUNT"

      # ========================
      # PREPARAR HISTORIAL
      # ========================
      - name: Restore and validate archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"
          BACKUPS="$REMOTE/archive-backups"

          rclone mkdir "$REMOTE"
          rclone mkdir "$BACKUPS"

          REMOTE_FILES="$(rclone lsf "$REMOTE" --files-only)"

          if printf '%s\n' "$REMOTE_FILES" | grep -Fxq "archive.txt"; then
            echo "Restaurando historial remoto..."

            rclone copyto "$REMOTE/archive.txt" archive.txt

            if [[ ! -s archive.txt ]]; then
              echo "::error::El historial remoto está vacío."
              echo "::error::Se detiene el proceso para proteger el historial."
              exit 1
            fi

            echo "archive_existed=true" >> "$GITHUB_OUTPUT"

          else
            BACKUP_FILES="$(rclone lsf "$BACKUPS" --files-only)"

            if [[ -n "$BACKUP_FILES" ]]; then
              echo "::error::No existe archive.txt, pero hay copias de seguridad."
              echo "::error::Recupera una copia antes de continuar."
              exit 1
            fi

            echo "::warning::No se encontró un historial previo."
            echo "Se inicializará archive.txt por primera vez."

            : > archive.txt

            echo "archive_existed=false" >> "$GITHUB_OUTPUT"
          fi

          # Conservar una copia local del historial original.
          cp archive.txt archive.before.txt

          mkdir -p downloads

          echo "Historial preparado correctamente."

      # ========================
      # DESCARGAS AUTENTICADAS
      # ========================
      - name: Download new videos with cookies
        id: download
        shell: bash
        run: |
          set -uo pipefail

          DOWNLOAD_ERRORS=0

          # Comprobar nuevamente las cookies antes de descargar.
          if [[ -z "${YOUTUBE_COOKIES_FILE:-}" ]] \
            || [[ ! -s "$YOUTUBE_COOKIES_FILE" ]]; then

            echo "::error::No están disponibles las cookies de YouTube."
            exit 1
          fi

          # Priorizar MP4/AVC1 y audio M4A.
          # Mantener alternativa MP4 hasta 1080p.
          FORMAT='bestvideo[ext=mp4][vcodec^=avc1][height<=1080]+bestaudio[ext=m4a][acodec^=mp4a]/best[ext=mp4][height<=1080]'

          # Organización por canal y fecha.
          OUTPUT='downloads/%(uploader)s/%(upload_date>%Y/%m/%d)s/%(title)s.%(ext)s'

          # Argumentos comunes para TODAS las descargas.
          COMMON_ARGS=(
            --cookies "$YOUTUBE_COOKIES_FILE"
            --js-runtimes node
            --ignore-errors
            --no-abort-on-error
            --retries 10
            --fragment-retries 10
            --extractor-retries 5
            --retry-sleep 5
            --download-archive archive.txt
            --no-overwrites
            --merge-output-format mp4
            --embed-thumbnail
            --add-metadata
            --concurrent-fragments 2
            --force-ipv4
            --http-chunk-size 10M
            -f "$FORMAT"
            -o "$OUTPUT"
          )

          # Una única ejecución sobre canales.txt.
          # No hay descargas sin cookies ni reintentos duplicados
          # entre fases de autenticación diferentes.

          if [[ -s canales.txt ]]; then

            echo "::group::Descarga autenticada de canales"

            if yt-dlp "${COMMON_ARGS[@]}" \
              --sleep-requests 5 \
              --sleep-interval 5 \
              --max-sleep-interval 15 \
              -a canales.txt; then

              echo "Descarga de canales completada."

            else
              STATUS=$?

              DOWNLOAD_ERRORS=1

              echo "::warning::La descarga terminó con código $STATUS."
              echo "Se continuará con la subida de los vídeos descargados correctamente."
            fi

            echo "::endgroup::"

          else
            echo "::warning::canales.txt no existe o está vacío."
            echo "No hay canales para procesar."
          fi

          echo "download_errors=$DOWNLOAD_ERRORS" >> "$GITHUB_OUTPUT"

          echo "===== RESUMEN DE DESCARGAS ====="
          echo "Modo: exclusivamente autenticado"
          echo "Cookies: activas"
          echo "Errores de descarga: $DOWNLOAD_ERRORS"

      # ========================
      # SUBIR VIDEOS
      # ========================
      - name: Upload videos to Google Drive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"

          if find downloads -type f -print -quit | grep -q .; then

            echo "Subiendo vídeos a Google Drive..."

            rclone copy downloads/ "$REMOTE/" \
              --transfers 3 \
              --checkers 6 \
              --tpslimit 4 \
              --drive-chunk-size 64M \
              --checksum \
              --retries 5 \
              --retries-sleep 10s \
              --log-level INFO

            echo "Transferencia completada."

          else
            echo "No hay vídeos nuevos para subir."
          fi

      # ========================
      # ACTUALIZAR HISTORIAL
      # ========================
      - name: Backup and upload archive
        shell: bash
        env:
          ARCHIVE_EXISTED: ${{ steps.archive.outputs.archive_existed }}
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"

          # No actualizar si no hubo cambios.
          if cmp -s archive.before.txt archive.txt; then
            echo "No hay cambios en archive.txt."
            exit 0
          fi

          # Respaldar el historial anterior antes de sustituirlo.
          if [[ "$ARCHIVE_EXISTED" == "true" ]]; then

            BACKUP_NAME="archive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"

            rclone copyto \
              archive.before.txt \
              "$REMOTE/archive-backups/$BACKUP_NAME"

            echo "Copia de seguridad creada: $BACKUP_NAME"

          fi

          # Actualizar el historial remoto.
          # Este paso solo se ejecuta si la subida de vídeos terminó correctamente.
          rclone copyto archive.txt "$REMOTE/archive.txt"

          # Verificar que el contenido remoto sea idéntico.
          rclone cat "$REMOTE/archive.txt" | cmp - archive.txt

          echo "Historial actualizado y verificado."

      # ========================
      # INFORME FINAL
      # ========================
      - name: Report download status
        if: always()
        shell: bash
        env:
          DOWNLOAD_ERRORS: ${{ steps.download.outputs.download_errors }}
        run: |
          set -euo pipefail

          echo "=================================="
          echo "YouTube Archive"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "=================================="

          if [[ "${DOWNLOAD_ERRORS:-}" == "1" ]]; then
            echo "::error::Hubo errores durante la descarga autenticada."
            echo "Los vídeos descargados correctamente se procesaron por separado."
            exit 1
          fi

          echo "No se reportaron errores de descarga."

      # ========================
      # LIMPIEZA DE CREDENCIALES
      # ========================
      - name: Cleanup cookies
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/youtube-cookies.txt"
          rm -f cookies.txt

          echo "Archivos locales de cookies eliminados."
