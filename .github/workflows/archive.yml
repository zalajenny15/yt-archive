
name: YouTube Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# Evita dos ejecuciones simultáneas y conserva una cola de hasta 100 pendientes.
# No combinar queue: max con cancel-in-progress: true.
concurrency:
  group: youtube-archive
  queue: max

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      # ========================
      # REPOSITORIO
      # ========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================
      # NODE.JS
      # ========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ========================
      # PYTHON
      # ========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ========================
      # DEPENDENCIAS
      # ========================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Se conserva yt-dlp actualizado porque YouTube cambia frecuentemente.
          # No se fija una versión antigua que pueda dejar de extraer vídeos.
          python -m pip install --upgrade "yt-dlp[default]"

          # FFmpeg realiza la fusión y el procesamiento de miniaturas/metadatos;
          # rclone gestiona las transferencias a Google Drive.
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

          echo "===== VERSIONES INSTALADAS ====="
          yt-dlp --version
          rclone version
          ffmpeg -version | head -n 1
          node --version

      # ========================
      # CONFIGURACION RCLONE
      # ========================
      - name: Setup rclone
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail

          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"

          # La credencial solo está disponible en este paso.
          if [[ -z "${RCLONE_CONFIG_B64:-}" ]]; then
            echo "::error::Falta configurar el secreto RCLONE_CONFIG."
            exit 1
          fi

          if ! printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$CONFIG_FILE"; then
            echo "::error::No se pudo decodificar RCLONE_CONFIG."
            rm -f "$CONFIG_FILE"
            exit 1
          fi

          if [[ ! -s "$CONFIG_FILE" ]]; then
            echo "::error::La configuración de rclone está vacía."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          install -m 600 "$CONFIG_FILE" "$HOME/.config/rclone/rclone.conf"
          rm -f "$CONFIG_FILE"

          if ! rclone listremotes | grep -Fxq "gdrive:"; then
            echo "::error::No se encontró el remoto gdrive en la configuración de rclone."
            exit 1
          fi

          echo "Configuración de rclone cargada correctamente."

      # ========================
      # COOKIES OBLIGATORIAS
      # ========================
      - name: Setup YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail

          COOKIE_FILE="$RUNNER_TEMP/youtube-cookies.txt"

          # No existe ningún modo alternativo: sin este secreto se detiene el job.
          if [[ -z "${YOUTUBE_COOKIES_B64:-}" ]]; then
            echo "::error::Falta configurar el secreto obligatorio YOUTUBE_COOKIES."
            exit 1
          fi

          if ! printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$COOKIE_FILE"; then
            echo "::error::No se pudo decodificar YOUTUBE_COOKIES en Base64."
            rm -f "$COOKIE_FILE"
            exit 1
          fi

          chmod 600 "$COOKIE_FILE"

          if [[ ! -s "$COOKIE_FILE" ]]; then
            echo "::error::El archivo de cookies está vacío."
            exit 1
          fi

          # Comprueba el encabezado Netscape y que existan registros tabulados.
          if ! head -n 1 "$COOKIE_FILE" | grep -Eq '^# (HTTP Cookie File|Netscape HTTP Cookie File)$'; then
            echo "::error::Las cookies no tienen un encabezado Netscape válido."
            exit 1
          fi

          COOKIE_COUNT=$(awk -F '\t' '
            !/^#/ && NF == 7 && ($1 ~ /(^|\.)youtube\.com$/ || $1 ~ /(^|\.)google\.com$/ || $1 ~ /(^|\.)googlevideo\.com$/) { count++ }
            END { print count+0 }
          ' "$COOKIE_FILE")

          if [[ "$COOKIE_COUNT" -eq 0 ]]; then
            echo "::error::No se encontraron cookies de dominios de YouTube/Google en formato Netscape."
            exit 1
          fi

          # La ruta se comparte con pasos posteriores sin exponer el contenido.
          echo "YOUTUBE_COOKIES_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"
          echo "Cookies Netscape cargadas. Registros relevantes: $COOKIE_COUNT"

      # ========================
      # PREPARAR HISTORIAL
      # ========================
      - name: Restore and validate archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"
          BACKUPS="$REMOTE/archive-backups"

          rclone mkdir "$REMOTE"
          rclone mkdir "$BACKUPS"

          REMOTE_FILES="$(rclone lsf "$REMOTE" --files-only)"

          if printf '%s\n' "$REMOTE_FILES" | grep -Fxq "archive.txt"; then
            echo "Restaurando historial remoto..."
            rclone copyto "$REMOTE/archive.txt" archive.txt

            # Un historial remoto existente y vacío se considera sospechoso.
            if [[ ! -s archive.txt ]]; then
              echo "::error::El historial remoto está vacío. Se detiene para protegerlo."
              exit 1
            fi

            echo "archive_existed=true" >> "$GITHUB_OUTPUT"
          else
            BACKUP_FILES="$(rclone lsf "$BACKUPS" --files-only)"

            # Nunca inicializar un archivo nuevo si existen respaldos recuperables.
            if [[ -n "$BACKUP_FILES" ]]; then
              echo "::error::No existe archive.txt, pero hay copias de seguridad."
              echo "::error::Recupera una copia antes de continuar."
              exit 1
            fi

            echo "::warning::No existe historial ni respaldo previo; se inicializa por primera vez."
            : > archive.txt
            echo "archive_existed=false" >> "$GITHUB_OUTPUT"
          fi

          # Formato esperado por yt-dlp: clave del extractor e ID, dos campos.
          # Se rechazan líneas vacías, malformadas o duplicadas para no propagar corrupción.
          if [[ -s archive.txt ]]; then
            awk '
              NF != 2 { printf "Registro malformado en línea %d.\n", NR > "/dev/stderr"; bad=1; next }
              $1 !~ /^[[:alnum:]_-]+$/ || $2 !~ /^[[:alnum:]_-]+$/ { printf "Registro inválido en línea %d.\n", NR > "/dev/stderr"; bad=1; next }
              seen[$1 FS $2]++ { printf "Registro duplicado en línea %d.\n", NR > "/dev/stderr"; bad=1 }
              END { exit bad }
            ' archive.txt || {
              echo "::error::archive.txt no supera la validación estructural. No se continuará."
              exit 1
            }
          fi

          # Copia local inmutable para comparar y respaldar antes de actualizar Drive.
          cp archive.txt archive.before.txt
          mkdir -p downloads

          echo "Historial restaurado y validado."

      # ========================
      # DESCARGAS AUTENTICADAS
      # ========================
      - name: Download new videos with cookies
        id: download
        shell: bash
        run: |
          set -uo pipefail

          DOWNLOAD_ERRORS=0

          # Segunda comprobación defensiva: ninguna invocación de yt-dlp puede
          # ejecutarse sin un archivo de cookies existente y no vacío.
          if [[ -z "${YOUTUBE_COOKIES_FILE:-}" || ! -s "$YOUTUBE_COOKIES_FILE" ]]; then
            echo "::error::Las cookies obligatorias no están disponibles."
            exit 1
          fi

          # Se conserva la preferencia original: MP4/AVC1 + M4A/MP4A hasta 1080p.
          # La alternativa mantiene MP4 hasta 1080p cuando no existe la combinación preferida.
          FORMAT='bestvideo[ext=mp4][vcodec^=avc1][height<=1080]+bestaudio[ext=m4a][acodec^=mp4a]/best[ext=mp4][height<=1080]'

          # Formato solicitado: canal/año/mes/día/fecha - título [ID].ext.
          # El ID evita colisiones entre vídeos con el mismo título y fecha.
          OUTPUT='downloads/%(uploader)s/%(upload_date>%Y/%m/%d)s/%(upload_date)s - %(title).180s [%(id)s].%(ext)s'

          COMMON_ARGS=(
            --cookies "$YOUTUBE_COOKIES_FILE"
            --js-runtimes node
            # yt-dlp continúa con los siguientes vídeos por defecto ante errores individuales;
            # no se usa --ignore-errors porque también ocultaría errores de postprocesamiento.
            --retries 10
            --fragment-retries 10
            --extractor-retries 5
            --retry-sleep 'http:exp=1:20'
            --retry-sleep 'fragment:exp=1:20'
            --retry-sleep 'extractor:exp=1:20'
            --download-archive archive.txt
            --no-overwrites
            --continue
            --merge-output-format mp4
            --embed-thumbnail
            --add-metadata
            --concurrent-fragments 2
            --force-ipv4
            --http-chunk-size 10M
            -f "$FORMAT"
            -o "$OUTPUT"
          )

          if [[ -s canales.txt ]]; then
            # Deduplica URLs exactamente iguales sin cambiar su orden.
            # yt-dlp ignora líneas de comentario y vacías en el archivo de lote.
            awk '
              /^[[:space:]]*#/ || /^[[:space:]]*$/ { print; next }
              !seen[$0]++ { print }
            ' canales.txt > canales.unicos.txt

            if [[ ! -s canales.unicos.txt ]]; then
              echo "::warning::No hay URLs válidas en canales.txt."
            else
              echo "::group::Descarga autenticada de canales"

              # Menor espera entre solicitudes de extracción que la configuración
              # anterior (5 s), manteniendo una pausa aleatoria de 5–10 s por vídeo.
              # No se ejecuta una segunda fase ni se reintentan canales sin cookies.
              if yt-dlp "${COMMON_ARGS[@]}" \
                --sleep-requests 1 \
                --sleep-interval 5 \
                --max-sleep-interval 10 \
                -a canales.unicos.txt; then
                echo "La ejecución de yt-dlp terminó sin errores reportados."
              else
                STATUS=$?
                DOWNLOAD_ERRORS=1
                echo "::warning::yt-dlp terminó con código $STATUS. Se conservarán y subirán los vídeos completados."
              fi

              echo "::endgroup::"
            fi
          else
            echo "::warning::canales.txt no existe o está vacío; no hay canales para procesar."
          fi

          # Valida el historial modificado por yt-dlp antes de permitir su publicación.
          if [[ -s archive.txt ]]; then
            awk '
              NF != 2 { printf "Registro malformado en línea %d.\n", NR > "/dev/stderr"; bad=1; next }
              $1 !~ /^[[:alnum:]_-]+$/ || $2 !~ /^[[:alnum:]_-]+$/ { printf "Registro inválido en línea %d.\n", NR > "/dev/stderr"; bad=1; next }
              seen[$1 FS $2]++ { printf "Registro duplicado en línea %d.\n", NR > "/dev/stderr"; bad=1 }
              END { exit bad }
            ' archive.txt || {
              echo "::error::El historial local quedó malformado después de yt-dlp."
              exit 1
            }
          fi

          echo "download_errors=$DOWNLOAD_ERRORS" >> "$GITHUB_OUTPUT"
          echo "Errores de descarga: $DOWNLOAD_ERRORS"

      # ========================
      # SUBIR VIDEOS
      # ========================
      - name: Upload videos to Google Drive
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"

          if find downloads -type f -print -quit | grep -q .; then
            echo "Subiendo vídeos a Google Drive..."

            # Se mantienen los valores conservadores aprobados:
            # 3 transferencias, 6 comprobadores, 4 solicitudes/s y bloques de 64 MiB.
            # --checksum evita transferencias redundantes cuando Drive ofrece hashes.
            rclone copy downloads/ "$REMOTE/" \
              --transfers 3 \
              --checkers 6 \
              --tpslimit 4 \
              --drive-chunk-size 64M \
              --checksum \
              --retries 5 \
              --retries-sleep 10s \
              --log-level INFO

            echo "Transferencia completada."
          else
            echo "No hay vídeos nuevos para subir."
          fi

      # ========================
      # ACTUALIZAR HISTORIAL
      # ========================
      - name: Backup and upload archive
        shell: bash
        env:
          ARCHIVE_EXISTED: ${{ steps.archive.outputs.archive_existed }}
        run: |
          set -euo pipefail

          REMOTE="gdrive:YouTubeArchive"

          # Si yt-dlp no registró vídeos nuevos, no se modifica el remoto.
          if cmp -s archive.before.txt archive.txt; then
            echo "No hay cambios en archive.txt."
            exit 0
          fi

          # Respalda el historial remoto anterior antes de sustituirlo.
          if [[ "$ARCHIVE_EXISTED" == "true" ]]; then
            BACKUP_NAME="archive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            BACKUP_PATH="$REMOTE/archive-backups/$BACKUP_NAME"

            rclone copyto archive.before.txt "$BACKUP_PATH"

            # Verifica que el respaldo remoto sea idéntico al archivo original.
            rclone cat "$BACKUP_PATH" | cmp - archive.before.txt
            echo "Copia de seguridad creada y verificada: $BACKUP_NAME"
          fi

          # Este paso solo se ejecuta si la subida de vídeos terminó correctamente.
          rclone copyto archive.txt "$REMOTE/archive.txt"

          # Verificación byte a byte del historial publicado.
          rclone cat "$REMOTE/archive.txt" | cmp - archive.txt

          echo "Historial actualizado y verificado."

      # ========================
      # INFORME FINAL
      # ========================
      - name: Report download status
        if: always()
        shell: bash
        env:
          DOWNLOAD_ERRORS: ${{ steps.download.outputs.download_errors }}
        run: |
          set -euo pipefail

          echo "=================================="
          echo "YouTube Archive"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "=================================="

          if [[ "${DOWNLOAD_ERRORS:-}" == "1" ]]; then
            echo "::error::Hubo errores durante la descarga autenticada."
            echo "Los archivos completados se subieron y el historial se actualizó solo si la transferencia y la verificación terminaron correctamente."
            exit 1
          fi

          echo "No se reportaron errores de descarga."

      # ========================
      # LIMPIEZA DE CREDENCIALES
      # ========================
      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          # Se ejecuta incluso si un paso anterior falla o se omite.
          rm -f "$RUNNER_TEMP/youtube-cookies.txt"
          rm -f "$RUNNER_TEMP/rclone.conf"
          rm -f "$HOME/.config/rclone/rclone.conf"
          rm -f cookies.txt
          rm -f canales.unicos.txt

          echo "Archivos temporales de credenciales eliminados."
